name: Android release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Restore the persistent release keystore. Without this every CI run
      # gets a fresh debug key, and Android refuses to install the new APK
      # as an update over the previous one (different signature). The same
      # key signs every shipped release.
      #
      # We can't use `if: ${{ secrets.X != '' }}` because the Actions parser
      # rejects "Unrecognized named-value: 'secrets'" when the secret is
      # not declared on the repo (e.g. a fresh fork). Instead, reference
      # the secret in `env:` and guard the step with a shell check.
      - name: Restore release keystore
        env:
          BEAM_KEYSTORE_BASE64: ${{ secrets.BEAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BEAM_KEYSTORE_BASE64" ]; then
            echo "BEAM_KEYSTORE_BASE64 not set — debug signing will be used"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$BEAM_KEYSTORE_BASE64" | base64 -d > android/keystore/beam-release.jks

      - name: Write keystore.properties
        env:
          BEAM_KEYSTORE_BASE64: ${{ secrets.BEAM_KEYSTORE_BASE64 }}
          BEAM_KEYSTORE_PASSWORD: ${{ secrets.BEAM_KEYSTORE_PASSWORD }}
          BEAM_KEY_ALIAS: ${{ secrets.BEAM_KEY_ALIAS }}
          BEAM_KEY_PASSWORD: ${{ secrets.BEAM_KEY_PASSWORD }}
        run: |
          if [ -z "$BEAM_KEYSTORE_BASE64" ]; then
            echo "no keystore secret — skipping keystore.properties"
            exit 0
          fi
          cat > android/keystore.properties << EOF
          storeFile=keystore/beam-release.jks
          storePassword=${BEAM_KEYSTORE_PASSWORD}
          keyAlias=${BEAM_KEY_ALIAS}
          keyPassword=${BEAM_KEY_PASSWORD}
          EOF

      - name: Build native release APK (Kotlin + Compose)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          BEAM_SERVER_URL: ${{ vars.BEAM_SERVER_URL }}
          BEAM_GOOGLE_KEY: ${{ vars.BEAM_GOOGLE_KEY }}

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Beam-${GITHUB_REF_NAME:-latest}.apk

      - name: Verify release signature
        env:
          BEAM_KEYSTORE_BASE64: ${{ secrets.BEAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BEAM_KEYSTORE_BASE64" ]; then
            echo "no release keystore restored — skipping signature verify"
            exit 0
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          $APKSIGNER verify --print-certs dist/*.apk | head -10

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Beam-apk
          path: dist/*.apk

      # Belt-and-braces — make sure no keystore ever leaks into an artifact.
      - name: Strip signing material from runner
        if: always()
        run: |
          rm -rf android/keystore android/keystore.properties || true
          echo "keystore material removed"
